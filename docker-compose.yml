services:
  mysql:
    image: mysql:8.0
    container_name: hyper-arena-mysql
    environment:
      MYSQL_ROOT_PASSWORD: alpha_root_pass
      MYSQL_USER: alpha_user
      MYSQL_PASSWORD: alpha_pass
      MYSQL_DATABASE: alpha_trace
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${ALPHA_TRACE_MYSQL_PORT:-23307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ualpha_user", "-palpha_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: hyper-arena-clickhouse
    environment:
      CLICKHOUSE_DB: alpha_trace
      CLICKHOUSE_USER: alpha_user
      CLICKHOUSE_PASSWORD: alpha_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:${ALPHA_TRACE_CLICKHOUSE_HTTP_PORT:-28123}:8123"
      - "127.0.0.1:${ALPHA_TRACE_CLICKHOUSE_NATIVE_PORT:-29000}:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "alpha_user", "--password", "alpha_pass", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:14
    container_name: hyper-arena-postgres
    environment:
      POSTGRES_USER: alpha_user
      POSTGRES_PASSWORD: alpha_pass
      POSTGRES_DB: alpha_arena
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25532}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha_user -d alpha_arena"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pass through host proxy settings (empty if host has none)
        http_proxy: ${http_proxy-}
        https_proxy: ${https_proxy-}
        HTTP_PROXY: ${HTTP_PROXY-}
        HTTPS_PROXY: ${HTTPS_PROXY-}
        ALL_PROXY: ${ALL_PROXY-}
    container_name: hyper-arena-app
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8802}
      # Database connection
      DATABASE_URL: postgresql://alpha_user:alpha_pass@postgres:5432/alpha_arena
      SNAPSHOT_DATABASE_URL: postgresql://alpha_user:alpha_pass@postgres:5432/alpha_snapshots
      # Hyperliquid Builder Fee Configuration
      HYPERLIQUID_BUILDER_ADDRESS: "0x012E82f81e506b8f0EF69FF719a6AC65822b5924"
      HYPERLIQUID_BUILDER_FEE: "30"
      # Binance Broker Configuration
      BINANCE_BROKER_ID: "tbyPbcd9"
      # Factor Engine
      FACTOR_ENGINE_ENABLED: "true"
      # Hyper Insight login-based integration
      HYPER_INSIGHT_API_BASE_URL: ${HYPER_INSIGHT_API_BASE_URL:-https://hyper.akooi.com}
      # AlphaTrace Qwen runner fallback configuration.
      # API keys are read from the host environment or existing Hyper AI DB config;
      # do not hard-code secrets in this file.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      # AlphaTrace runtime store. MySQL is now the default product persistence target.
      # /app/data keeps the JSON fallback and migration source.
      ALPHA_TRACE_AGENT_RUN_STORE: ${ALPHA_TRACE_AGENT_RUN_STORE:-mysql}
      ALPHA_TRACE_AGENT_RUN_STORE_PATH: ${ALPHA_TRACE_AGENT_RUN_STORE_PATH:-/app/data/alpha_trace_agent_runs.json}
      # AlphaTrace domain stores also default to MySQL, seeded from static data if empty.
      ALPHA_TRACE_DOMAIN_STORE: ${ALPHA_TRACE_DOMAIN_STORE:-mysql}
      # AlphaTrace MySQL target for AgentRunStore and domain stores.
      ALPHA_TRACE_MYSQL_DATABASE_URL: ${ALPHA_TRACE_MYSQL_DATABASE_URL:-mysql+pymysql://alpha_user:alpha_pass@mysql:3306/alpha_trace?charset=utf8mb4}
      # AlphaTrace ClickHouse target for structured business/analytics imports.
      ALPHA_TRACE_CLICKHOUSE_URL: ${ALPHA_TRACE_CLICKHOUSE_URL:-http://clickhouse:8123}
      ALPHA_TRACE_CLICKHOUSE_USER: ${ALPHA_TRACE_CLICKHOUSE_USER:-alpha_user}
      ALPHA_TRACE_CLICKHOUSE_PASSWORD: ${ALPHA_TRACE_CLICKHOUSE_PASSWORD:-alpha_pass}
      ALPHA_TRACE_ETF_INDEX_VALUATION_TABLE: ${ALPHA_TRACE_ETF_INDEX_VALUATION_TABLE:-alpha_trace.etf_index_valuation_daily}
      ALPHA_TRACE_FILE_IMPORT_DIR: ${ALPHA_TRACE_FILE_IMPORT_DIR:-/app/data/test}
      # Lixinger Open API. Keep tokens on the backend/container only.
      ALPHATRACE_LIXINGER_TOKEN: ${ALPHATRACE_LIXINGER_TOKEN:-}
      LIXINGER_TOKEN: ${LIXINGER_TOKEN:-}
      ALPHATRACE_LIXINGER_BASE_URL: ${ALPHATRACE_LIXINGER_BASE_URL:-https://open.lixinger.com/api}
      ALPHATRACE_LIXINGER_TIMEOUT_SECONDS: ${ALPHATRACE_LIXINGER_TIMEOUT_SECONDS:-20}
      # OpenClaw gateway integration for the market dashboard chat box.
      OPENCLAW_WS_URL: ${OPENCLAW_WS_URL:-}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
      OPENCLAW_SESSION_KEY: ${OPENCLAW_SESSION_KEY:-agent:main:main}
      OPENCLAW_DEVICE_KEY_PATH: ${OPENCLAW_DEVICE_KEY_PATH:-/app/data/openclaw-device-key.pem}
      OPENCLAW_CHAT_TIMEOUT_SECONDS: ${OPENCLAW_CHAT_TIMEOUT_SECONDS:-90}
      # AlphaTrace backend log tail for AgentRunDetail diagnostics.
      ALPHATRACE_BACKEND_LOG_PATH: ${ALPHATRACE_BACKEND_LOG_PATH:-/app/logs/backend-runtime.log}
      # Explicitly disable all proxy settings in container
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      no_proxy: ""
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8802}:${BACKEND_PORT:-8802}"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      # ========== Selective Backend Mounts for Hot Reload ==========
      # Mount individual directories and files to enable hot reload while preserving
      # the built frontend static files in the container image.
      #
      # IMPORTANT: Do NOT mount ./backend:/app/backend as it will override the
      # /app/backend/static directory that contains the built frontend files,
      # causing "Frontend not built yet" errors.
      #
      # If you add new directories or important Python files under backend/,
      # remember to add corresponding volume mounts here to enable hot reload.

      # Backend subdirectories
      - ./backend/api:/app/backend/api
      - ./backend/backtest:/app/backend/backtest
      - ./backend/config:/app/backend/config
      - ./backend/database:/app/backend/database
      - ./backend/factors:/app/backend/factors
      - ./backend/integrations:/app/backend/integrations
      - ./backend/program_trader:/app/backend/program_trader
      - ./backend/repositories:/app/backend/repositories
      - ./backend/routes:/app/backend/routes
      - ./backend/schemas:/app/backend/schemas
      - ./backend/scripts:/app/backend/scripts
      - ./backend/services:/app/backend/services
      - ./backend/utils:/app/backend/utils

      # Backend root files (frequently modified during development)
      - ./backend/main.py:/app/backend/main.py
      - ./backend/models.py:/app/backend/models.py

      # DO NOT mount ./backend/static - it must remain from the Docker image build
      # ===============================================================

      # Mount logs
      - ./logs:/app/logs
      # Mount local ETF test data for server-side imports.
      - ./data/test:/app/data/test:ro
      # Mount data for encryption key persistence
      - app_data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  clickhouse_data:
    driver: local
  app_data:
    driver: local

networks:
  default:
    name: hyper-arena-network
